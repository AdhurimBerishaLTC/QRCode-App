# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8e21c5d5d52e44e68c429634cd564ca9"
name = "Adhurim Store Lab"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_orders,read_customers,write_customers,write_metaobjects,write_metaobject_definitions,read_metaobject_definitions,write_app_proxy,write_discounts,write_cart_transforms,write_payment_customizations,customer_read_orders,customer_write_orders, write_pixels, read_pixels, read_customer_events, read_products, customer_read_customers,customer_read_orders"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[customer.metafields.app.qr_discount_redeemed]
type = "boolean"
name = "QR discount redeemed"
description = "Tracks whether a customer has already redeemed the QR discount"

  [customer.metafields.app.qr_discount_redeemed.access]
  admin = "merchant_read_write"

[metaobjects.app.product_qr]
name = "QR Code"
description = "QR codes that link to products"

  [metaobjects.app.product_qr.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[metaobjects.app.product_qr.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.product_qr.fields.product]
name = "Product"
type = "product_reference"

[metaobjects.app.product_qr.fields.product_variant]
name = "Product Variant"
type = "variant_reference"

[metaobjects.app.product_qr.fields.destination]
name = "Destination"
type = "single_line_text_field"

[metaobjects.app.product_qr.fields.scans]
name = "Scans"
type = "number_integer"

[app_proxy]
url = "/qrcodes"
subpath = "qrcodes"
prefix = "apps"


[events]
api_version = "unstable"

[[events.subscription]]
handle = "product-updates"
topic = "Product"
actions = ["update"]
uri = "/events/products/update"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/webhooks/products/update"

  # Delivered to Google Pub/Sub.
  # Grant delivery@shopify-pubsub-webhooks.iam.gserviceaccount.com Pub/Sub Publisher.
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "pubsub://ltc-we:LTC-webhooks"


[product.metafields.app.issues]
type = "json"
name = "Issue Tracker"
description = "Tracks issues logged for this product"
access.admin = "merchant_read_write"

[discount.metafields.app.function-configuration]
type = "json"
name = "Function configuration"
access.admin = "merchant_read_write"
access.storefront = "none"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
