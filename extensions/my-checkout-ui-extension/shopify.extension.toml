# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

api_version = "2026-07"

[[extensions]]
name = "my-checkout-ui-extension"
handle = "my-checkout-ui-extension"
type = "ui_extension"
uid = "add4bd6b-f1e3-acf9-fb3a-588274d558b028b7a905"

[extensions.capabilities]
api_access = true

[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/Checkout.jsx"

[[extensions.targeting]]
module = "./src/OrderStatusPageSurvey.jsx"
target = "customer-account.order-status.customer-information.render-after"

[[extensions.metafields]]
namespace = "custom"
key = "deliveryinstructions"

[[extensions.metafields]]
namespace = "custom"
key = "sale_attribution"

[[extensions.metafields]]
namespace = "$app"
key = "requestedFreeGift"

[extensions.settings]
[[extensions.settings.fields]]
key = "heading"
type = "single_line_text_field"
name = "Banner heading"
description = "Enter a heading for the banner."
[[extensions.settings.fields]]
key = "description"
type = "single_line_text_field"
name = "Banner description"
description = "Enter a description for the banner."
[[extensions.settings.fields]]
key = "tone"
type = "single_line_text_field"
name = "Banner tone"
[[extensions.settings.fields.validations]]
name = "choices"
value = "[\"info\", \"success\", \"warning\", \"critical\"]"
[[extensions.settings.fields]]
key = "collapsible"
type = "boolean"
name = "Show collapsible description."
description = "Display controls to expand or collapse the banner description."

[[extensions.settings.fields]]
key = "attribution_title"
type = "single_line_text_field"
name = "Checkout survey title"
description = "Question shown on the checkout attribution survey. Leave blank to use the default."
[[extensions.settings.fields]]
key = "attribution_description"
type = "single_line_text_field"
name = "Checkout survey description"
description = "Supporting text for the checkout attribution survey."
[[extensions.settings.fields]]
key = "attribution_option_tv"
type = "single_line_text_field"
name = "Checkout option: TV"
[[extensions.settings.fields]]
key = "attribution_option_podcast"
type = "single_line_text_field"
name = "Checkout option: Podcast"
[[extensions.settings.fields]]
key = "attribution_option_family"
type = "single_line_text_field"
name = "Checkout option: Friend or family"
[[extensions.settings.fields]]
key = "attribution_option_tiktok"
type = "single_line_text_field"
name = "Checkout option: TikTok"

[[extensions.settings.fields]]
key = "review_title"
type = "single_line_text_field"
name = "Order status survey title"
description = "Question shown on the Order status page survey. Leave blank to use the default."
[[extensions.settings.fields]]
key = "review_description"
type = "single_line_text_field"
name = "Order status survey description"
description = "Supporting text for the Order status page survey."
[[extensions.settings.fields]]
key = "review_option_5"
type = "single_line_text_field"
name = "Order status option: Amazing"
[[extensions.settings.fields]]
key = "review_option_4"
type = "single_line_text_field"
name = "Order status option: Okay"
[[extensions.settings.fields]]
key = "review_option_3"
type = "single_line_text_field"
name = "Order status option: Eh"
[[extensions.settings.fields]]
key = "review_option_2"
type = "single_line_text_field"
name = "Order status option: Regret"
