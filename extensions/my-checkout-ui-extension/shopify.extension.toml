# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

# The version of APIs your extension will receive. Learn more:
# https://shopify.dev/docs/api/usage/versioning
api_version = "2026-07"

[[extensions]]
name = "my-checkout-ui-extension"
handle = "my-checkout-ui-extension"
type = "ui_extension"
uid = "add4bd6b-f1e3-acf9-fb3a-588274d558b028b7a905"

# Controls where in Shopify your extension will be injected,
# and the file that contains your extension’s source code. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/extension-targets-overview

[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/Checkout.jsx"

[[extensions.targeting]]
module = "./src/ThankYouPageSurvey.jsx"
target = "purchase.thank-you.customer-information.render-after"

[[extensions.targeting]]
module = "./src/OrderStatusPageSurvey.jsx"
target = "customer-account.order-status.customer-information.render-after"

[[extensions.metafields]]
namespace = "custom"
key = "deliveryinstructions"

[extensions.capabilities]
# Gives your extension access to directly query Shopify’s storefront API.
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#api-access
api_access = true

# Gives your extension access to make external network calls, using the
# JavaScript `fetch()` API. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#network-access
# network_access = true

# Loads metafields on checkout resources, including the cart,
# products, customers, and more. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#metafields

[[extensions.metafields]]
namespace = "$app"
key = "requestedFreeGift"

# Defines settings that will be collected from merchants installing
# your extension. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration#settings-definition

[extensions.settings]
[[extensions.settings.fields]]
key = "heading"
type = "single_line_text_field"
name = "Banner heading"
description = "Enter a heading for the banner."
[[extensions.settings.fields]]
key = "description"
type = "single_line_text_field"
name = "Banner description"
description = "Enter a description for the banner."
[[extensions.settings.fields]]
key = "tone"
type = "single_line_text_field"
name = "Banner tone"
[[extensions.settings.fields.validations]]
name = "choices"
value = "[\"info\", \"success\", \"warning\", \"critical\"]"
[[extensions.settings.fields]]
key = "collapsible"
type = "boolean"
name = "Show collapsible description."
description = "Display controls to expand or collapse the banner description."

[[extensions.settings.fields]]
key = "attribution_title"
type = "single_line_text_field"
name = "Thank you survey title"
description = "Question shown on the Thank you page survey. Leave blank to use the default."
[[extensions.settings.fields]]
key = "attribution_description"
type = "single_line_text_field"
name = "Thank you survey description"
description = "Supporting text for the Thank you page survey."
[[extensions.settings.fields]]
key = "attribution_option_tv"
type = "single_line_text_field"
name = "Thank you option: TV"
[[extensions.settings.fields]]
key = "attribution_option_podcast"
type = "single_line_text_field"
name = "Thank you option: Podcast"
[[extensions.settings.fields]]
key = "attribution_option_family"
type = "single_line_text_field"
name = "Thank you option: Friend or family"
[[extensions.settings.fields]]
key = "attribution_option_tiktok"
type = "single_line_text_field"
name = "Thank you option: TikTok"

[[extensions.settings.fields]]
key = "review_title"
type = "single_line_text_field"
name = "Order status survey title"
description = "Question shown on the Order status page survey. Leave blank to use the default."
[[extensions.settings.fields]]
key = "review_description"
type = "single_line_text_field"
name = "Order status survey description"
description = "Supporting text for the Order status page survey."
[[extensions.settings.fields]]
key = "review_option_5"
type = "single_line_text_field"
name = "Order status option: Amazing"
[[extensions.settings.fields]]
key = "review_option_4"
type = "single_line_text_field"
name = "Order status option: Okay"
[[extensions.settings.fields]]
key = "review_option_3"
type = "single_line_text_field"
name = "Order status option: Eh"
[[extensions.settings.fields]]
key = "review_option_2"
type = "single_line_text_field"
name = "Order status option: Regret"
