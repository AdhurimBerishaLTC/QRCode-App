query DeliveryInput {
  cart {
    attribute(key: "src") {
      value
    }
    buyerIdentity {
      customer {
        qrDiscountRedeemed: metafield(
          namespace: "$app"
          key: "qr_discount_redeemed"
        ) {
          jsonValue
        }
      }
    }
    deliveryGroups {
      id
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:qr-discount", key: "function-configuration") {
      jsonValue
    }
  }
  localization {
    language {
      isoCode
    }
  }
}
