query CartInput {
  cart {
    attribute(key: "src") {
      value
    }
    retailLocation {
      id
    }
    buyerIdentity {
      isAuthenticated
      customer {
        qrDiscountRedeemed: metafield(
          namespace: "$app"
          key: "qr_discount_redeemed"
        ) {
          jsonValue
        }
      }
    }
    lines {
      id
      qrSrc: attribute(key: "src") {
        value
      }
      cost {
        subtotalAmount {
          amount
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:qr-discount", key: "function-configuration") {
      jsonValue
    }
  }
  localization {
    language {
      isoCode
    }
  }
}
