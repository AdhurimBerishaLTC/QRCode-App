query CartInput {
  cart {
    attribute(key: "src") {
      value
    }
    lines {
      id
      cost {
        subtotalAmount {
          amount
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:qr-discount", key: "function-configuration") {
      jsonValue
    }
  }
}
