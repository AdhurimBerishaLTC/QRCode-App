name = "my-web-pixel"
type = "web_pixel_extension"
uid = "5dd0f111-62d8-91e2-8f50-8436afb95d0bfe12168a"

runtime_context = "strict"

[customer_privacy]
analytics = true
marketing = true
preferences = false
sale_of_data = "enabled"

[settings]
type = "object"

[settings.fields.accountID]
name = "Account ID"
description = "Account ID"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]

[settings.fields.endpoint]
name = "Pixel endpoint"
description = "HTTPS URL that receives pixel events. Synced automatically from the app URL."
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]

